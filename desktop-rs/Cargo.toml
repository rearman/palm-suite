# Palm Desktop in Rust with fltk-rs: core (the port of sync-core) and the scaling spike.
[workspace]
members = ["core", "spike"]
resolver = "2"

[workspace.package]
edition = "2021"
license = "MIT"

[profile.release]
lto = true
codegen-units = 1
strip = true

# Dependencies build optimized in tests too, so the 600,000-round PBKDF2 vector takes well under a second.
[profile.dev.package."*"]
opt-level = 3
