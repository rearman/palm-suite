[package]
name = "palm-desktop"
version = "0.0.0"
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
getrandom = "0.4.3"
jiff = "0.2.38"
palm-core = { path = "../core" }
serde_json = "1.0.154"

[target.'cfg(not(target_os = "linux"))'.dependencies]
fltk = "=1.5.23"

# Native Wayland windows on Linux; FLTK falls back to X11 when no Wayland session runs.
[target.'cfg(target_os = "linux")'.dependencies]
fltk = { version = "=1.5.23", features = ["use-wayland"] }
