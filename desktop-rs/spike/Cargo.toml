[package]
name = "palm-desktop-spike"
version = "0.0.0"
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
fltk = "=1.5.23"

# Native Wayland windows on Linux; FLTK falls back to X11 when no Wayland session runs.
[target.'cfg(target_os = "linux")'.dependencies]
fltk = { version = "=1.5.23", features = ["use-wayland"] }
