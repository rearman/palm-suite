name: Build APKs

# Builds and tests the two phone apps, the watch app, the sync server and the desktop app. A tag handheld-v*,
# launcher-v*, watch-v*, server-v* or desktop-v* also releases that one part. A release tag build keeps the two newest releases of each app and deletes the older ones.
on:
  push:
    branches: [ main, master ]
    tags: [ 'handheld-v*', 'launcher-v*', 'watch-v*', 'server-v*', 'desktop-v*' ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write # to create the release on a tag build
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      # Every screen, dialog and control of the Android apps needs its row in INVENTORY.md. The check
      # runs first, so a missing row fails the build before Gradle starts.
      - name: Check UI inventory
        run: python3 tools/ui_inventory.py --check

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.4.1'

      # compileSdk 37 (the watch app's Glance Wear needs it). The runner image may not have the platform yet.
      - name: Install Android platform 37
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-37" > /dev/null

      - name: Build APKs
        run: gradle assembleRelease testDebugUnitTest :sync-core:test --stacktrace

      # The test vectors of the desktop ports: VectorsTest writes a missing sync-core/testdata file, and a
      # changed output to sync-core/build/vectors. Both go up for review, also when the tests fail.
      - name: Upload test vectors
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: sync-core-vectors
          path: |
            sync-core/testdata
            sync-core/build/vectors
          if-no-files-found: ignore

      # A tag build names the APK of its app after the tag, for example handheld-v1.13.apk or watch-v1.0.apk.
      - name: Rename APKs
        id: apk
        env:
          TAG: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
        run: |
          db=handheld.apk
          pl=palm-launcher.apk
          wt=watch.apk
          case "$TAG" in
            handheld-v*) db="$TAG.apk" ;;
            launcher-v*) pl="palm-$TAG.apk" ;;
            watch-v*) wt="$TAG.apk" ;;
          esac
          mv datebook/app/build/outputs/apk/release/app-release.apk "$db"
          mv palm-launcher/app/build/outputs/apk/release/app-release.apk "$pl"
          mv datebook/wear/build/outputs/apk/release/wear-release.apk "$wt"
          echo "handheld=$db" >> "$GITHUB_OUTPUT"
          echo "launcher=$pl" >> "$GITHUB_OUTPUT"
          echo "watch=$wt" >> "$GITHUB_OUTPUT"
          case "$TAG" in
            handheld-v*) echo "release=$db" >> "$GITHUB_OUTPUT" ;;
            launcher-v*) echo "release=$pl" >> "$GITHUB_OUTPUT" ;;
            watch-v*) echo "release=$wt" >> "$GITHUB_OUTPUT" ;;
          esac

      # archive: false uploads the file itself and accepts only one file, so each APK has its own step.
      - name: Upload handheld APK
        uses: actions/upload-artifact@v7
        with:
          path: ${{ steps.apk.outputs.handheld }}
          archive: false

      - name: Upload launcher APK
        uses: actions/upload-artifact@v7
        with:
          path: ${{ steps.apk.outputs.launcher }}
          archive: false

      - name: Upload watch APK
        uses: actions/upload-artifact@v7
        with:
          path: ${{ steps.apk.outputs.watch }}
          archive: false

      # On a release tag, attach the APK of that app to the GitHub Release of the tag. A rerun replaces it.
      - name: Attach APK to release
        if: startsWith(github.ref_name, 'handheld-v') || startsWith(github.ref_name, 'launcher-v') || startsWith(github.ref_name, 'watch-v')
        env:
          GH_TOKEN: ${{ github.token }}
          APK: ${{ steps.apk.outputs.release }}
        run: |
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "$APK" --clobber
          else
            gh release create "$GITHUB_REF_NAME" "$APK" --title "$GITHUB_REF_NAME" --generate-notes
          fi

      # Keep the two newest releases of this app (this one and the one before) and delete the older
      # ones. Their tags stay. Versions sort with sort -V. The handheld app was released as datebook
      # up to datebook-v1.12, so a handheld release also deletes the datebook releases.
      - name: Delete old releases
        if: startsWith(github.ref_name, 'handheld-v') || startsWith(github.ref_name, 'launcher-v') || startsWith(github.ref_name, 'watch-v')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prefix="${GITHUB_REF_NAME%-v*}"
          pattern="^$prefix-v"
          [ "$prefix" = handheld ] && pattern="^(handheld|datebook)-v"
          gh release list --limit 1000 --json tagName -q '.[].tagName' | grep -E "$pattern" | sort -V | head -n -2 |
            while read -r tag; do gh release delete "$tag" --yes; done

  server:
    runs-on: ubuntu-latest
    permissions:
      contents: write # to create the release on a server tag build
    defaults:
      run:
        working-directory: sync-server
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          # The newest stable Go on each build. go.mod sets only the minimum version.
          go-version: stable
          check-latest: true
          cache-dependency-path: sync-server/go.mod

      - name: Check format
        run: |
          test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }

      - name: Vet and test
        run: |
          go vet ./... && go test ./...

      - name: Build
        run: |
          for arch in amd64 arm64; do
            CGO_ENABLED=0 GOOS=linux GOARCH=$arch go build -trimpath -ldflags='-s -w' -o palmsync-linux-$arch .
          done

      # archive: false uploads the file itself and accepts only one file, so each binary has its own step.
      - name: Upload amd64 binary
        uses: actions/upload-artifact@v7
        with:
          path: sync-server/palmsync-linux-amd64
          archive: false

      - name: Upload arm64 binary
        uses: actions/upload-artifact@v7
        with:
          path: sync-server/palmsync-linux-arm64
          archive: false

      # On a server tag, attach both binaries to the GitHub Release of the tag. A rerun replaces them.
      - name: Attach binaries to release
        if: startsWith(github.ref_name, 'server-v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" palmsync-linux-amd64 palmsync-linux-arm64 --clobber
          else
            gh release create "$GITHUB_REF_NAME" palmsync-linux-amd64 palmsync-linux-arm64 --title "$GITHUB_REF_NAME" --generate-notes
          fi

      # Keep the two newest releases of this app (this one and the one before) and delete the older
      # ones. Their tags stay. Versions sort with sort -V.
      - name: Delete old releases
        if: startsWith(github.ref_name, 'server-v')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prefix="${GITHUB_REF_NAME%-v*}"
          gh release list --limit 1000 --json tagName -q '.[].tagName' | grep "^$prefix-v" | sort -V | head -n -2 |
            while read -r tag; do gh release delete "$tag" --yes; done

  # The desktop app (desktop-cpp/), C++23 and FLTK: the modules and their doctest tests, built with CMake and
  # run with CTest, on Windows amd64 (MSYS2), Linux amd64 and arm64. Each build is packaged (pkg) and uploaded,
  # and a desktop-v* tag attaches the packages to its release.
  desktop-cpp:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, name: windows-amd64, shell: 'msys2 {0}', cxx: g++, pkg: palm-desktop-windows.msi }
          - { os: ubuntu-24.04, name: linux-amd64, shell: bash, cxx: g++-14, pkg: palm-desktop-linux-x86_64.tar.gz }
          - { os: ubuntu-24.04-arm, name: linux-arm64, shell: bash, cxx: g++-14, pkg: palm-desktop-linux-arm64.tar.gz }
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write # to create the release on a desktop tag build
    defaults:
      run:
        working-directory: desktop-cpp
        shell: ${{ matrix.shell }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      # MSYS2 provides the MinGW-w64 toolchain, CMake, Ninja and the libraries on Windows.
      - name: Install toolchain (Windows)
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            git
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-ninja
            mingw-w64-x86_64-openssl
            mingw-w64-x86_64-curl
            mingw-w64-x86_64-nlohmann-json
            mingw-w64-x86_64-doctest

      # FLTK 1.4.5 builds from source (CMake FetchContent) with Cairo and Pango, a Wayland window, else X11.
      - name: Install toolchain (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends g++-14 cmake ninja-build libssl-dev libcurl4-openssl-dev \
            zlib1g-dev nlohmann-json3-dev doctest-dev libx11-dev libxext-dev libxft-dev libxinerama-dev \
            libxcursor-dev libxrender-dev libxfixes-dev libpango1.0-dev libcairo2-dev libwayland-dev \
            wayland-protocols libxkbcommon-dev libdbus-1-dev

      # clang-format 20.1.3 checks the style of core/ and app/ against desktop-cpp/.clang-format.
      - name: Check format
        if: matrix.name == 'linux-amd64'
        run: |
          find core app -name '*.cpp' -o -name '*.hpp' | xargs pipx run --spec clang-format==20.1.3 clang-format --dry-run -Werror

      # The server test of desktop-cpp/core needs a running palmsync: build it from sync-server/ and start
      # it on a fresh data folder. PALMSYNC_REQUIRED makes the test fail if the server is missing.
      - name: Set up Go
        if: matrix.name == 'linux-amd64'
        uses: actions/setup-go@v5
        with:
          go-version: stable
          check-latest: true
          cache-dependency-path: sync-server/go.mod

      - name: Start palmsync
        if: matrix.name == 'linux-amd64'
        run: |
          (cd ../sync-server && go build -o "$RUNNER_TEMP/palmsync" .)
          data="$RUNNER_TEMP/palmsync-data"
          mkdir -p "$data"
          token=$("$RUNNER_TEMP/palmsync" token add -data "$data" ci | awk '{print $NF}')
          nohup "$RUNNER_TEMP/palmsync" serve -data "$data" -listen 127.0.0.1:8640 > "$RUNNER_TEMP/palmsync.log" 2>&1 &
          for i in $(seq 20); do curl -s -o /dev/null http://127.0.0.1:8640/v1/meta && break; sleep 0.5; done
          echo "PALMSYNC_URL=http://127.0.0.1:8640" >> "$GITHUB_ENV"
          echo "PALMSYNC_TOKEN=$token" >> "$GITHUB_ENV"
          echo "PALMSYNC_REQUIRED=1" >> "$GITHUB_ENV"

      - name: Configure
        env:
          CXX: ${{ matrix.cxx }}
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build

      - name: Test
        run: ctest --test-dir build --output-on-failure

      # WiX 3 for the MSI. The runner image may have WiX 3.14; install it only where it is missing.
      - name: Install WiX
        if: runner.os == 'Windows'
        shell: bash
        run: |
          [ -x "/c/Program Files (x86)/WiX Toolset v3.14/bin/candle.exe" ] || choco install wixtoolset -y --no-progress

      # desktop-cpp/packaging/package.sh: on Windows an MSI with the MSYS2 DLLs the app loads, on Linux a tar.gz
      # with the app and the icon. A desktop-v1.2.3 tag gives version 1.2.3, other builds 0.0.<run>.
      - name: Package
        id: pkg
        run: |
          case "$GITHUB_REF_NAME" in
            desktop-v*) version="${GITHUB_REF_NAME#desktop-v}" ;;
            *) version="0.0.$GITHUB_RUN_NUMBER" ;;
          esac
          app=build/palm-desktop
          if [ "$RUNNER_OS" = Windows ]; then
            app=$app.exe
            export PATH="$PATH:/c/Program Files (x86)/WiX Toolset v3.14/bin"
          fi
          bash packaging/package.sh "$app" "$version" "${{ matrix.pkg }}"
          echo "file=${{ matrix.pkg }}" >> "$GITHUB_OUTPUT"

      # Install the MSI for this user with no UI, check the program and both shortcuts, start the installed
      # program with only the Windows folders on PATH (so a DLL missing from the MSI fails), take a shot, and
      # remove it again.
      - name: Check the MSI
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $msi = (Resolve-Path "${{ steps.pkg.outputs.file }}").Path
          $log = "$env:RUNNER_TEMP\install.log"
          $p = Start-Process msiexec -ArgumentList "/i `"$msi`" /qn /l*v `"$log`"" -Wait -PassThru
          if ($p.ExitCode -ne 0) { Get-Content $log -Tail 60; throw "install failed: exit $($p.ExitCode)" }
          $exe = "$env:LOCALAPPDATA\Palm Desktop\palm-desktop.exe"
          if (-not (Test-Path $exe)) { throw "no program at $exe" }
          $menu = "$env:APPDATA\Microsoft\Windows\Start Menu\Programs\Palm\Palm Desktop.lnk"
          if (-not (Test-Path $menu)) { throw "no shortcut at $menu" }
          $desk = Join-Path ([Environment]::GetFolderPath('Desktop')) "Palm Desktop.lnk"
          if (-not (Test-Path $desk)) { throw "no shortcut at $desk" }
          $env:PATH = "$env:SystemRoot\System32;$env:SystemRoot"
          $env:APPDATA = "$env:RUNNER_TEMP\appdata"
          New-Item -ItemType Directory -Force $env:APPDATA | Out-Null
          $shot = "$env:RUNNER_TEMP\installed.ppm"
          $p = Start-Process $exe -ArgumentList "--shot `"$shot`"" -PassThru
          $null = $p.Handle
          if (-not $p.WaitForExit(60000)) { $p.Kill(); throw "the installed program did not exit" }
          if ($p.ExitCode -ne 0 -or -not (Test-Path $shot)) { throw "the installed program failed: exit $($p.ExitCode)" }
          $p = Start-Process msiexec -ArgumentList "/x `"$msi`" /qn" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "uninstall failed: exit $($p.ExitCode)" }
          if ((Test-Path $exe) -or (Test-Path $menu) -or (Test-Path $desk)) { throw "uninstall left files" }

      - name: Upload package
        uses: actions/upload-artifact@v7
        with:
          path: desktop-cpp/${{ steps.pkg.outputs.file }}
          archive: false

      # On a desktop tag, attach the package to the GitHub Release of the tag. The three jobs can all try to
      # create the release; one that loses uploads to it.
      - name: Attach package to release
        if: startsWith(github.ref_name, 'desktop-v')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          FILE: ${{ steps.pkg.outputs.file }}
        run: |
          gh release upload "$GITHUB_REF_NAME" "$FILE" --clobber \
            || gh release create "$GITHUB_REF_NAME" "$FILE" --title "$GITHUB_REF_NAME" --generate-notes \
            || gh release upload "$GITHUB_REF_NAME" "$FILE" --clobber

      # Keep the two newest releases of this app (this one and the one before) and delete the older ones. Their
      # tags stay. Versions sort with sort -V. Only the Linux amd64 job deletes, so the jobs do not race.
      - name: Delete old releases
        if: startsWith(github.ref_name, 'desktop-v') && matrix.name == 'linux-amd64'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prefix="${GITHUB_REF_NAME%-v*}"
          gh release list --limit 1000 --json tagName -q '.[].tagName' | grep "^$prefix-v" | sort -V | head -n -2 |
            while read -r tag; do gh release delete "$tag" --yes; done
