name: Build APKs

# Builds and tests both apps, the sync server and the desktop app. A tag datebook-v*, launcher-v*, server-v* or
# desktop-v* also releases that one part.
on:
  push:
    branches: [ main, master ]
    tags: [ 'datebook-v*', 'launcher-v*', 'server-v*', 'desktop-v*' ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write # to create the release on a tag build
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build APKs
        run: gradle assembleDebug testDebugUnitTest :sync-core:test --stacktrace

      # A tag build names the APK of its app after the tag, for example datebook-v1.2.apk.
      - name: Rename APKs
        id: apk
        env:
          TAG: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
        run: |
          db=datebook.apk
          pl=palm-launcher.apk
          case "$TAG" in
            datebook-v*) db="$TAG.apk" ;;
            launcher-v*) pl="palm-$TAG.apk" ;;
          esac
          mv datebook/app/build/outputs/apk/debug/app-debug.apk "$db"
          mv palm-launcher/app/build/outputs/apk/debug/app-debug.apk "$pl"
          echo "datebook=$db" >> "$GITHUB_OUTPUT"
          echo "launcher=$pl" >> "$GITHUB_OUTPUT"
          case "$TAG" in
            datebook-v*) echo "release=$db" >> "$GITHUB_OUTPUT" ;;
            launcher-v*) echo "release=$pl" >> "$GITHUB_OUTPUT" ;;
          esac

      # archive: false uploads the file itself and accepts only one file, so each APK has its own step.
      - name: Upload Date Book APK
        uses: actions/upload-artifact@v7
        with:
          path: ${{ steps.apk.outputs.datebook }}
          archive: false

      - name: Upload launcher APK
        uses: actions/upload-artifact@v7
        with:
          path: ${{ steps.apk.outputs.launcher }}
          archive: false

      # On a release tag, attach the APK of that app to the GitHub Release of the tag. A rerun replaces it.
      - name: Attach APK to release
        if: startsWith(github.ref_name, 'datebook-v') || startsWith(github.ref_name, 'launcher-v')
        env:
          GH_TOKEN: ${{ github.token }}
          APK: ${{ steps.apk.outputs.release }}
        run: |
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "$APK" --clobber
          else
            gh release create "$GITHUB_REF_NAME" "$APK" --title "$GITHUB_REF_NAME" --generate-notes
          fi

  server:
    runs-on: ubuntu-latest
    permissions:
      contents: write # to create the release on a server tag build
    defaults:
      run:
        working-directory: sync-server
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: sync-server/go.mod
          cache-dependency-path: sync-server/go.mod

      - name: Check format
        run: |
          test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }

      - name: Vet and test
        run: |
          go vet ./... && go test ./...

      - name: Build
        run: |
          for arch in amd64 arm64; do
            CGO_ENABLED=0 GOOS=linux GOARCH=$arch go build -trimpath -ldflags='-s -w' -o palmsync-linux-$arch .
          done

      # archive: false uploads the file itself and accepts only one file, so each binary has its own step.
      - name: Upload amd64 binary
        uses: actions/upload-artifact@v7
        with:
          path: sync-server/palmsync-linux-amd64
          archive: false

      - name: Upload arm64 binary
        uses: actions/upload-artifact@v7
        with:
          path: sync-server/palmsync-linux-arm64
          archive: false

      # On a server tag, attach both binaries to the GitHub Release of the tag. A rerun replaces them.
      - name: Attach binaries to release
        if: startsWith(github.ref_name, 'server-v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" palmsync-linux-amd64 palmsync-linux-arm64 --clobber
          else
            gh release create "$GITHUB_REF_NAME" palmsync-linux-amd64 palmsync-linux-arm64 --title "$GITHUB_REF_NAME" --generate-notes
          fi

  # The desktop app for Windows and Linux. jpackage builds for the system it runs on, so each OS has its own runner.
  desktop:
    strategy:
      matrix:
        os: [ windows-latest, ubuntu-latest ]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write # to create the release on a desktop tag build
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      # configure-on-demand leaves the Android projects out of this build.
      - name: Test and build
        run: gradle --configure-on-demand :desktop:test :desktop:installDist --stacktrace

      # An app image holds the app and its own Java runtime, so nothing else needs to be installed.
      - name: Package
        id: pkg
        shell: bash
        run: |
          jpackage --type app-image --name palm-desktop --input desktop/build/install/desktop/lib             --main-jar desktop.jar --main-class com.rearman.palmdesktop.MainKt --dest out
          if [ "$RUNNER_OS" = Windows ]; then
            file=palm-desktop-windows.zip
            (cd out && 7z a -tzip "../$file" palm-desktop > /dev/null)
          else
            file=palm-desktop-linux.tar.gz
            tar -C out -czf "$file" palm-desktop
          fi
          echo "file=$file" >> "$GITHUB_OUTPUT"

      - name: Upload desktop app
        uses: actions/upload-artifact@v7
        with:
          path: ${{ steps.pkg.outputs.file }}
          archive: false

      # On a desktop tag, attach the package to the GitHub Release of the tag. The two OS jobs can
      # both try to create the release; the one that loses uploads to it.
      - name: Attach package to release
        if: startsWith(github.ref_name, 'desktop-v')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          FILE: ${{ steps.pkg.outputs.file }}
        run: |
          gh release upload "$GITHUB_REF_NAME" "$FILE" --clobber             || gh release create "$GITHUB_REF_NAME" "$FILE" --title "$GITHUB_REF_NAME" --generate-notes             || gh release upload "$GITHUB_REF_NAME" "$FILE" --clobber
