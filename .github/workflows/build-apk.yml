name: Build APKs

# Builds and tests both apps, the sync server and the desktop app. A tag handheld-v*, launcher-v*, server-v* or
# desktop-v* also releases that one part. A release tag build keeps the two newest releases of each app and deletes the older ones.
on:
  push:
    branches: [ main, master ]
    tags: [ 'handheld-v*', 'launcher-v*', 'server-v*', 'desktop-v*' ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write # to create the release on a tag build
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build APKs
        run: gradle assembleRelease testDebugUnitTest :sync-core:test --stacktrace

      # A tag build names the APK of its app after the tag, for example handheld-v1.13.apk.
      - name: Rename APKs
        id: apk
        env:
          TAG: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
        run: |
          db=handheld.apk
          pl=palm-launcher.apk
          case "$TAG" in
            handheld-v*) db="$TAG.apk" ;;
            launcher-v*) pl="palm-$TAG.apk" ;;
          esac
          mv datebook/app/build/outputs/apk/release/app-release.apk "$db"
          mv palm-launcher/app/build/outputs/apk/release/app-release.apk "$pl"
          echo "handheld=$db" >> "$GITHUB_OUTPUT"
          echo "launcher=$pl" >> "$GITHUB_OUTPUT"
          case "$TAG" in
            handheld-v*) echo "release=$db" >> "$GITHUB_OUTPUT" ;;
            launcher-v*) echo "release=$pl" >> "$GITHUB_OUTPUT" ;;
          esac

      # archive: false uploads the file itself and accepts only one file, so each APK has its own step.
      - name: Upload handheld APK
        uses: actions/upload-artifact@v7
        with:
          path: ${{ steps.apk.outputs.handheld }}
          archive: false

      - name: Upload launcher APK
        uses: actions/upload-artifact@v7
        with:
          path: ${{ steps.apk.outputs.launcher }}
          archive: false

      # On a release tag, attach the APK of that app to the GitHub Release of the tag. A rerun replaces it.
      - name: Attach APK to release
        if: startsWith(github.ref_name, 'handheld-v') || startsWith(github.ref_name, 'launcher-v')
        env:
          GH_TOKEN: ${{ github.token }}
          APK: ${{ steps.apk.outputs.release }}
        run: |
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "$APK" --clobber
          else
            gh release create "$GITHUB_REF_NAME" "$APK" --title "$GITHUB_REF_NAME" --generate-notes
          fi

      # Keep the two newest releases of this app (this one and the one before) and delete the older
      # ones. Their tags stay. Versions sort with sort -V. The handheld app was released as datebook
      # up to datebook-v1.12, so a handheld release also deletes the datebook releases.
      - name: Delete old releases
        if: startsWith(github.ref_name, 'handheld-v') || startsWith(github.ref_name, 'launcher-v')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prefix="${GITHUB_REF_NAME%-v*}"
          pattern="^$prefix-v"
          [ "$prefix" = handheld ] && pattern="^(handheld|datebook)-v"
          gh release list --limit 1000 --json tagName -q '.[].tagName' | grep -E "$pattern" | sort -V | head -n -2 |
            while read -r tag; do gh release delete "$tag" --yes; done

  server:
    runs-on: ubuntu-latest
    permissions:
      contents: write # to create the release on a server tag build
    defaults:
      run:
        working-directory: sync-server
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          # The newest stable Go on each build. go.mod sets only the minimum version.
          go-version: stable
          check-latest: true
          cache-dependency-path: sync-server/go.mod

      - name: Check format
        run: |
          test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }

      - name: Vet and test
        run: |
          go vet ./... && go test ./...

      - name: Build
        run: |
          for arch in amd64 arm64; do
            CGO_ENABLED=0 GOOS=linux GOARCH=$arch go build -trimpath -ldflags='-s -w' -o palmsync-linux-$arch .
          done

      # archive: false uploads the file itself and accepts only one file, so each binary has its own step.
      - name: Upload amd64 binary
        uses: actions/upload-artifact@v7
        with:
          path: sync-server/palmsync-linux-amd64
          archive: false

      - name: Upload arm64 binary
        uses: actions/upload-artifact@v7
        with:
          path: sync-server/palmsync-linux-arm64
          archive: false

      # On a server tag, attach both binaries to the GitHub Release of the tag. A rerun replaces them.
      - name: Attach binaries to release
        if: startsWith(github.ref_name, 'server-v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" palmsync-linux-amd64 palmsync-linux-arm64 --clobber
          else
            gh release create "$GITHUB_REF_NAME" palmsync-linux-amd64 palmsync-linux-arm64 --title "$GITHUB_REF_NAME" --generate-notes
          fi

      # Keep the two newest releases of this app (this one and the one before) and delete the older
      # ones. Their tags stay. Versions sort with sort -V.
      - name: Delete old releases
        if: startsWith(github.ref_name, 'server-v')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prefix="${GITHUB_REF_NAME%-v*}"
          gh release list --limit 1000 --json tagName -q '.[].tagName' | grep "^$prefix-v" | sort -V | head -n -2 |
            while read -r tag; do gh release delete "$tag" --yes; done

  # The desktop app for Windows and Linux. jpackage builds for the system it runs on, so each OS has its own runner.
  desktop:
    strategy:
      matrix:
        os: [ windows-latest, ubuntu-latest ]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write # to create the release on a desktop tag build
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      # configure-on-demand leaves the Android projects out of this build.
      - name: Test and build
        run: gradle --configure-on-demand :desktop:test :desktop:installDist --stacktrace

      # jpackage in JDK 17 makes an MSI with WiX 3.
      - name: Install WiX
        if: runner.os == 'Windows'
        shell: bash
        run: |
          # The runner image already has WiX 3.14. Install it only where it is missing.
          command -v candle.exe > /dev/null || [ -x "/c/Program Files (x86)/WiX Toolset v3.14/bin/candle.exe" ] \
            || choco install wixtoolset -y --no-progress
          echo "C:\Program Files (x86)\WiX Toolset v3.14\bin" >> "$GITHUB_PATH"

      # Each package holds the app and its own Java runtime, so nothing else needs to be installed.
      # Windows: an MSI that installs for the current user and upgrades an older version in place. The
      # installer asks for the shortcuts: the official Palm Desktop puts a "Palm Desktop" shortcut on the
      # desktop too, and clearing the box keeps it.
      # The upgrade UUID must never change. A desktop-v1.2.3 tag gives version 1.2.3, other builds 0.0.<run>.
      # Linux: an app image in a tar.gz.
      - name: Package
        id: pkg
        shell: bash
        run: |
          if [ "$RUNNER_OS" = Windows ]; then
            case "$GITHUB_REF_NAME" in
              desktop-v*) version="${GITHUB_REF_NAME#desktop-v}" ;;
              *) version="0.0.$GITHUB_RUN_NUMBER" ;;
            esac
            echo "$version" | grep -Eq '^[0-9]+(\.[0-9]+){0,2}$' || { echo "bad version $version"; exit 1; }
            jpackage --type msi --name "Palm Desktop" --app-version "$version" --vendor rearman \
              --description "Palm Desktop for Windows" --icon desktop/packaging/palm-desktop.ico \
              --input desktop/build/install/desktop/lib --main-jar desktop.jar \
              --main-class com.rearman.palmdesktop.MainKt \
              --win-upgrade-uuid 9703d1fd-0a96-45b3-8842-4b8bbcad48dc --win-per-user-install \
              --win-menu --win-menu-group "Palm" --win-shortcut --win-shortcut-prompt --dest out
            file=palm-desktop-windows.msi
            mv out/*.msi "$file"
          else
            jpackage --type app-image --name palm-desktop --input desktop/build/install/desktop/lib \
              --main-jar desktop.jar --main-class com.rearman.palmdesktop.MainKt \
              --icon desktop/packaging/palm-desktop.png --dest out
            file=palm-desktop-linux.tar.gz
            tar -C out -czf "$file" palm-desktop
            # The jars and the icon alone, for the Gentoo ebuild in gentoo/, which runs them on the system Java.
            mkdir -p jars/palm-desktop
            cp -r desktop/build/install/desktop/lib jars/palm-desktop/
            cp desktop/packaging/palm-desktop.png jars/palm-desktop/palm-desktop.png
            tar -C jars -czf palm-desktop-jars.tar.gz palm-desktop
            echo "jars=palm-desktop-jars.tar.gz" >> "$GITHUB_OUTPUT"
          fi
          echo "file=$file" >> "$GITHUB_OUTPUT"

      - name: Upload desktop app
        uses: actions/upload-artifact@v7
        with:
          path: ${{ steps.pkg.outputs.file }}
          archive: false

      - name: Upload desktop jars
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v7
        with:
          path: ${{ steps.pkg.outputs.jars }}
          archive: false

      # On a desktop tag, attach the packages to the GitHub Release of the tag. The two OS jobs can
      # both try to create the release; the one that loses uploads to it. FILES is unquoted on
      # purpose: it holds one or two file names with no spaces.
      - name: Attach packages to release
        if: startsWith(github.ref_name, 'desktop-v')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          FILES: ${{ steps.pkg.outputs.file }} ${{ steps.pkg.outputs.jars }}
        run: |
          gh release upload "$GITHUB_REF_NAME" $FILES --clobber \
            || gh release create "$GITHUB_REF_NAME" $FILES --title "$GITHUB_REF_NAME" --generate-notes \
            || gh release upload "$GITHUB_REF_NAME" $FILES --clobber

      # Keep the two newest releases of this app (this one and the one before) and delete the older
      # ones. Their tags stay. Versions sort with sort -V. Only the Linux job deletes, so the two OS jobs do not race.
      - name: Delete old releases
        if: startsWith(github.ref_name, 'desktop-v') && runner.os == 'Linux'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prefix="${GITHUB_REF_NAME%-v*}"
          gh release list --limit 1000 --json tagName -q '.[].tagName' | grep "^$prefix-v" | sort -V | head -n -2 |
            while read -r tag; do gh release delete "$tag" --yes; done
